<!DOCTYPE html>
<html>
<head>
    <title>Traffic AI Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">Traffic Density Analysis</h1>

    <div class="card bg-secondary p-4">

        <!-- Execution Mode at Top -->
        <div class="mb-4 text-center">
            <label class="form-label d-block">Execution Mode</label>
            <button class="btn btn-outline-light me-2" onclick="setMode('Sequential')" id="seqBtn">
                Sequential
            </button>
            <button class="btn btn-outline-light" onclick="setMode('Parallel')" id="parBtn">
                Parallel
            </button>
        </div>

        <!-- Upload -->
        <div class="mb-3">
            <label class="form-label">Upload Video</label>
            <input class="form-control" type="file" id="videoInput" accept="video/*">
            <video id="preview" class="mt-3 w-100" controls preload="metadata" playsinline></video>
        </div>

        <div class="mb-3">
            <label class="form-label">Upload XML file </label>
            <input class="form-control" type="file" id="xmlInput" accept=".xml">
        </div>

        <!-- Rows & Columns as Textbox -->
        <div class="row">
            <div class="col-md-6">
                <label>Rows</label>
                <input type="number" min="1" max="20" value="6" class="form-control" id="rows">
            </div>

            <div class="col-md-6">
                <label>Columns</label>
                <input type="number" min="1" max="20" value="6" class="form-control" id="cols">
            </div>
        </div>

        <!-- Color Channel -->
        <div class="mt-3">
            <label>Color Channel</label>
            <select class="form-select" id="channel">
                <option>H</option>
                <option>S</option>
                <option selected>V</option>
                <option>H+S</option>
                <option>H+V</option>
                <option>S+V</option>
                <option>H+S+V</option>
                <option>gray</option>
            </select>
        </div>

        <button class="btn btn-primary mt-4 w-100" id="uploadBtn" onclick="uploadConfig()">
             Upload & Configure
        </button>

        <!-- Calibration Section (Hidden initially) -->
        <div id="calibrationSection" class="mt-5" style="display: none;">
            <hr class="border-light">
            <h3 class="mb-3 text-center">Calibration</h3>
            <p class="text-center text-muted">Select two points representing a known real-world distance (e.g. lane width ~3.5m or car width ~1.7m).</p>
            
            <div class="position-relative bg-dark d-inline-block w-100 text-center" style="min-height: 200px; border: 1px solid #444;">
                <img id="calibImg" class="img-fluid" style="user-select: none;" alt="Calibration Frame">
                <canvas id="calibCanvas" class="position-absolute top-0 start-50 translate-middle-x" style="cursor: crosshair;"></canvas>
            </div>

            <div class="row mt-3 align-items-end">
                <div class="col-md-6">
                    <label>Real-world distance (meters):</label>
                    <input type="number" step="0.1" min="0.1" class="form-control" id="realWorldDist" placeholder="e.g. 15.0">
                </div>
                <div class="col-md-6 text-end">
                    <button class="btn btn-warning w-100" id="calcCalibBtn" onclick="calculateCalibration()">Calculate Calibration</button>
                </div>
            </div>
            
            <div id="calibResult" class="mt-3 text-black fw-bold text-center" style="display: none;">
                Pixels per meter: <span id="ppmValue"></span>
            </div>
            <div id="calibWarning" class="mt-2 text-warning fw-bold text-center" style="display: none;"></div>

            <button class="btn btn-success mt-4 w-100" id="runAnalysisBtn" onclick="runAnalysis()" disabled>
                 Run Analysis
            </button>
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
